  _common:
    block_time: "UTC timestamp when the block was produced"
    block_date_utc: "UTC date of the block (for partitioning)"
    block_date: "UTC date of the block (for partitioning)"
    slot: "Solana slot number (block height)"
    tx_idx: "Transaction index within the block"
    swap_idx: "Swap index within the transaction"
    ix_idx: "Instruction index within the transaction"
    signature: "Transaction signature (base58 encoded)"
    signer: "Wallet address that signed the transaction"
