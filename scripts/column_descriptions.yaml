# Column Descriptions for ClickHouse Tables
#
# This file contains human-readable descriptions for table columns.
# The generator script merges these descriptions into the auto-generated documentation.
#
# Structure:
#   database_name:
#     table_name:
#       column_name: "Description of the column"

solana:
  # Common columns across many tables
  _common:
    block_time: "UTC timestamp when the block was produced"
    block_date_utc: "UTC date of the block (for partitioning)"
    block_date: "UTC date of the block (for partitioning)"
    slot: "Solana slot number (block height)"
    tx_idx: "Transaction index within the block"
    swap_idx: "Swap index within the transaction"
    ix_idx: "Instruction index within the transaction"
    signature: "Transaction signature (base58 encoded)"
    signer: "Wallet address that signed the transaction"
    signing_wallet: "Wallet address that signed the transaction"
    fee_payer: "Wallet that paid the transaction fee"
    provided_gas_fee: "Gas fee provided for the transaction (lamports)"
    provided_gas_limit: "Compute unit limit requested"
    fee: "Transaction fee paid (lamports)"
    consumed_gas: "Compute units actually consumed"
    failed: "Whether the transaction failed (1=yes, 0=no)"
    cu_price_ix_index: "Instruction index of the compute-unit price instruction"
    cu_limit_ix_index: "Instruction index of the compute-unit limit instruction"
    num_signatures: "Number of signatures on the transaction"
    transaction_version: "Transaction message version (-1=legacy, 0=v0, -2=unknown)"
    lookup_tables: "Pipe-delimited account addresses loaded through address lookup tables (writable first, then read-only)"
    src_wallet: "Source wallet address"
    dst_wallet: "Destination wallet address"
    direction: "Trade direction (buy/sell)"
    base_coin: "Base token mint address"
    quote_coin: "Quote token mint address (usually SOL or USDC)"
    base_token: "Base token mint address"
    quote_token: "Quote token mint address"
    base_coin_amount: "Base token amount (raw units, needs decimal adjustment)"
    quote_coin_amount: "Quote token amount (raw units)"
    base_token_amount: "Base token amount (raw units)"
    quote_token_amount: "Quote token amount (raw units)"
    parent_program: "Parent program that invoked this instruction (for CPI calls)"
    top_level_transfers_json: "JSON array of top-level SOL/token transfers in the transaction"
    pool: "Pool account address"
    pool_id: "Pool account address"
    mint: "Token mint address"
    user: "User wallet address"
    creator: "Wallet that created the token"
    name: "Token name"
    symbol: "Token ticker symbol"
    url: "Metadata URI (usually IPFS)"

    instruction_type: "Decoded protocol instruction name; interpret optional event fields in the context of this instruction"
    blockhash_prefix: "Stored prefix of the transaction's recent blockhash"
    signers: "Transaction signer addresses in message order; ClickHouse arrays use one-based indexing"
    base_mint: "Base token mint address"
    quote_mint: "Quote token mint address"
    min_amount_out: "Minimum output allowed by the swap instruction, in raw token units"
    max_amount_in: "Maximum input allowed by the swap instruction, in raw token units"
    pf_program_account_index: "Pump.fun program account index in the transaction message"
    tip_index: "Index recorded for the transaction tip instruction"
    holder_rewards_bps: "Holder reward rate in basis points"
    holder_rewards: "Holder reward amount in raw quote-token units"
    trader: "Derived trader: first signer, second signer for recognized fee sponsors, or fee_payer when signers is empty"
    quote_price_date: "Date of the most recent quote closing price on or before the trade date; NULL when no price matches"
    quote_price_usd: "Raw quote conversion rate: multiply the raw quote amount by this value and divide by 1e6 to obtain USD"
    volume_usd: "Trade quote amount converted to USD; NULL when the quote price is unavailable"
    supply_raw: "Base token supply in raw units used for valuation; NULL when unavailable"
    token_price_usd: "Executed price in USD per whole base token; NULL when required price, amount or decimals are unavailable"
    usd_mcap: "Executed base-token price multiplied by supply, in USD; NULL when required inputs are unavailable"
    lb_pair: "Meteora DLMM liquidity-bin pair account address"

  jito_tips:
    sender: "Wallet that sent the tip"
    tip_account: "Jito tip account that received the tip"
    amount: "Tip amount in lamports"

  max_caps:
    token_mint: "Token mint address"
    max_mcap_sol: "Maximum market cap reached (in SOL)"
    max_mcap_usdc: "Maximum market cap reached (in USDC)"
    max_slot: "Slot when maximum market cap was reached"

  sol_top_ups:
    amount: "Amount of SOL transferred, in lamports"

  token_transfers:
    amount: "Token amount transferred in raw base units (apply the mint's decimals for display)"
    flavour: "Transfer encoding: add 16 for Token-2022; base values are 0=Transfer, 1=TransferChecked, 2=TransferCheckedWithFee, and 3=SetAuthority owner change"

  indexer3_sol_fundings:
    _description: "One row per sender/receiver pair in a successful transaction where wallets lost and gained SOL, from the indexer3 server (UTC). Receiver gains below about 0.09 SOL and program accounts are left out. No signature column; identify the transaction by slot and tx_idx. With several senders or receivers each row repeats the full loss and gain, so filter n_src = 1 AND n_dst = 1 for exact pairs and never sum dst_increase over rows with n_src > 1."
    src_wallet: "Wallet whose SOL balance decreased"
    dst_wallet: "Wallet whose SOL balance increased"
    src_decrease: "Total SOL the sender lost in the transaction, in lamports"
    dst_increase: "Total SOL the receiver gained in the transaction, in lamports"
    n_src: "Number of senders (wallets that lost SOL) in the transaction"
    n_dst: "Number of receivers (wallets that gained SOL) in the transaction"
    src_pre_balance: "Sender's SOL balance before the transaction, in lamports"
    dst_pre_balance: "Receiver's SOL balance before the transaction, in lamports"
    num_signatures: "Number of signatures on the transaction"
    transaction_version: "Transaction message version (-1=legacy, 0=v0, -2=unknown)"
    top_level_transfers_json: "JSON array of top-level SOL/token transfers in the transaction"

  indexer3_sol_top_ups:
    _description: "SOL balances going from zero to above zero, from the indexer3 server (UTC), with longer retention than sol_top_ups. One row per signer when a transaction has several signers."
    src_wallet: "Transaction signer credited as the sender of the top-up"
    dst_wallet: "Account whose SOL balance went from zero to above zero"
    amount: "Amount of SOL the receiver gained, in lamports"
    signers: "Transaction signer addresses in message order; ClickHouse arrays use one-based indexing"
    lookup_tables: "Pipe-delimited account addresses loaded through address lookup tables (writable first, then read-only)"
    direct_dst_transfer_srcs: "Senders of top-level System Program transfers directly to dst_wallet; empty when the account was funded another way, e.g. by a program"
    direct_dst_transfer_amounts: "Amounts of those direct transfers in lamports, aligned with direct_dst_transfer_srcs"
    cu_limit_ix_index: "Instruction index of the compute-unit limit instruction"
    num_signatures: "Number of signatures on the transaction"
    transaction_version: "Transaction message version (-1=legacy, 0=v0, -2=unknown)"
    top_level_transfers_json: "JSON array of top-level SOL/token transfers in the transaction"

  indexer3_token_transfers:
    _description: "SPL token transfers from the indexer3 server (UTC), with longer retention than token_transfers. No signature column; identify the transaction by slot and tx_idx."
    mint: "Token mint address"
    src_wallet: "Source wallet address"
    dst_wallet: "Destination wallet address"
    amount: "Token amount transferred in raw base units (apply the mint's decimals for display)"
    flavour: "Transfer encoding: add 16 for Token-2022; base values are 0=Transfer, 1=TransferChecked, 2=TransferCheckedWithFee, and 3=SetAuthority owner change"
    inner_ix_idx: "Inner instruction index within ix_idx; -1 for a top-level instruction"
    src_pre_amount: "Source token balance before the transaction, in raw base units"
    dst_pre_amount: "Destination token balance before the transaction, in raw base units"
    num_signatures: "Number of signatures on the transaction"
    transaction_version: "Transaction message version (-1=legacy, 0=v0, -2=unknown)"
    top_level_transfers_json: "JSON array of top-level SOL/token transfers in the transaction"

  meteora_dynamic_bonding_swaps: &meteora_dbc_columns
    base_coin_slippage: "Slippage on base token (negative = less than expected)"
    quote_coin_slippage: "Slippage on quote token (negative = less than expected)"
    orig_base_coin_amount: "Original base amount before slippage"
    orig_quote_coin_amount: "Original quote amount before slippage"
    config: "Pool configuration account"
    trade_direction: "Numeric trade direction indicator"
    has_referral: "Whether trade included a referral (1=yes, 0=no)"
    swap_amount0: "First swap amount in the route"
    swap_amount1: "Second swap amount in the route"
    swap_mode: "Swap mode (exact in/out)"
    input_amount: "Input amount for the swap"
    output_amount: "Output amount from the swap"
    base_mint: "Base token mint address"
    quote_mint: "Quote token mint address"
    referral: "Referral account address (if any)"

  meteora_swaps:
    start_bin_id: "Starting bin ID in the DLMM pool"
    end_bin_id: "Ending bin ID after the swap"
    protocol_fee: "Protocol fee amount"
    fee_bps_low: "Lower bound of fee in basis points"
    fee_bps_high: "Upper bound of fee in basis points"
    host_fee: "Host/frontend fee amount"
    fee_paid: "Total fee paid"
    lb_pair: "Liquidity bin pair (pool) address"
    from_wallet: "Source wallet for the swap"
    swap_for_y: "Whether swapping for Y token (1=yes, 0=no)"

  pfamm_migrations:
    mint_amount: "Token amount migrated"
    sol_amount: "SOL amount in the migration"
    pool_migration_fee: "Fee paid for pool migration"
    bonding_curve: "Bonding curve account address"
