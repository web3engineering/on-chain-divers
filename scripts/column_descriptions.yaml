  pumpfun_all_swaps:
    virtual_token_balance_after: "Virtual token reserves after trade (bonding curve state)"
    virtual_sol_balance_after: "Virtual SOL reserves after trade (bonding curve state)"
    is_exact_quote: "Whether quote amount was exact (1=yes, 0=no)"

  pumpfun_v2_swaps: &pumpfun_v2_columns
    instruction_type: "Pump.fun instruction variant: `buy`, `sell`, `buy_v2`, `sell_v2`, `buy_exact_sol_in`, or `buy_exact_quote_in_v2`"
    virtual_token_balance_after: "Virtual token reserves after trade (bonding curve state)"
    virtual_sol_balance_after: "Virtual SOL reserves after trade (bonding curve state)"

  pumpfun_amm_admin_set_coin_creator:
    pool: "Pool account being modified"

  pumpfun_creator_fee_distributions:
    receiver: "Creator wallet receiving the fee distribution"
    amount: "Fee amount distributed (lamports)"
    fee_distribution_method: "Method used for fee distribution"

  pumpfun_token_creation:
    bundle_size: "Number of transactions in the bundle"
    gas_used: "Total gas used for token creation"
    amount_of_instructions: "Number of instructions in the transaction"
    amount_of_lookup_reads: "Number of address lookup table reads"
    amount_of_lookup_writes: "Number of address lookup table writes"
    bundle_structure: "Structure of bundled transactions"
    bundled_buys: "Total SOL amount in bundled buys"
    bundled_buys_count: "Number of bundled buy transactions"
    dev_balance: "Developer's token balance after creation"
    creation_ix_index: "Index of creation instruction"
    curve_address: "Bonding curve account address"
    pf_program_index: "Pump.fun program index in transaction"
    direct_pf_invocation: "Whether pump.fun was called directly (1=yes, 0=no)"
    version: "Record version timestamp"
    mayhem_mode: "Whether mayhem mode was enabled"
    token_program: "Token program used (SPL Token or Token-2022)"
    is_cashback_enabled: "Whether cashback was enabled for creation"

  pumpswap_all_swaps: &pumpswap_columns
    _description: "PumpSwap swaps with separate curve, LP-pool and user quote amounts. Use pool_quote_amount for pricing-reserve movement and user_quote_amount for user cash flow. The quote-flow migration corrected newly written buy amounts and post-swap reserves; older rows can retain the previous semantics."
    quote_token_amount_limit: "Maximum quote token amount limit"
    quote_token_amount: "Raw event quote amount; its meaning varies between regular, exact-quote and routed buys. Use the explicit flow columns for accounting"
    quote_token_amount_without_lp_fee: "Newly written buys: net curve amount (swap_quote_amount); sells: pool_quote_amount. Historical buys used the raw event amount including LP fees"
    pool_quote_amount: "Raw quote amount entering LP liquidity on a buy or leaving it on a sell; reconciles the pricing-reserve movement"
    swap_quote_amount: "Quote amount priced on the curve, excluding all fees"
    user_quote_amount: "Total quote paid by the user on buys or received on sells, including the effect of all fees"
    fees_retained_in_pool: "Protocol fees minus buyback fees, plus creator fees retained in the quote vault for v2 or multi-hop swaps; zero for v1. Historical rows may use the default zero"
    protocol_fee_recipient: "Protocol fee recipient; the System Program address indicates fees retained in the pool. Historical rows may be empty"
    buy_back_fees: "Buyback component of protocol_fee in raw quote-token units; do not add it to the total fee a second time"
    buy_back_fees_basis_points: "Buyback share of the protocol fee, in basis points"
    user_base_token_account: "User's base token account"
    user_quote_token_account: "User's quote token account"
    user_base_token_reserves: "User's base token balance"
    user_quote_token_reserves: "User's quote token balance"
    pool_base_token_reserves_before: "Pool base token reserves before swap"
    pool_quote_token_reserves_before: "Pool quote token reserves before swap"
    pool_base_token_reserves_after: "Pool base token reserves after swap"
    pool_quote_token_reserves_after: "Post-swap pricing reserve; add fees_retained_in_pool for the quote vault balance. Historical rows written before the quote-flow correction used the raw quote_token_amount"
    lp_fee_basis_points: "LP fee in basis points"
    lp_fee: "LP fee amount"
    protocol_fee_basis_points: "Protocol fee in basis points"
    protocol_fee: "Protocol fee amount"
    is_exact_quote: "Whether quote amount was exact (1=yes, 0=no)"

