# Column Descriptions for ClickHouse Tables
#
# This file contains human-readable descriptions for table columns.
# The generator script merges these descriptions into the auto-generated documentation.
#
# Structure:
#   database_name:
#     table_name:
#       column_name: "Description of the column"

solana:
